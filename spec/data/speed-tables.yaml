# AI speed tables — distance-to-target → desired speed + acceleration profile.
# Each AI entity selects a table based on its current mission and reads the
# row whose `distance` is the largest value <= current distance to target.

unit_notes:
  distance_units: |
    Pixels in world space. Note: original 6809 code stores some distances
    left-shifted (×8) for fixed-point precision; values here are in pixels
    after that shift is undone.
  speed_units: |
    Original "nano-pixel per 16ms tick" units. To approximate pixels/frame
    at 60Hz: divide by 16 (rough). Treat as relative tunables — the *shape*
    of each table (band ratios) matters more than absolute units.
  accel_routines:
    - asrd0
    - asrd1
    - asrd2
    - asrd3
    - asrd4
    - asrd5
  accel_routine_meaning:
    asrd0: No acceleration — instant snap to target speed
    asrd1: 1/128 of velocity delta per frame — extremely lazy
    asrd2: 1/64 of velocity delta per frame — slow
    asrd3: 1/32 of velocity delta per frame — moderate
    asrd4: 1/16 of velocity delta per frame — quick
    asrd5: 1/8 of velocity delta per frame — snappy

