modernization_notes:
  - These tables describe *target* speeds; the accel row controls how aggressively the entity reaches them.
  - For a remake, treat tables as data assets — load from this YAML, interpolate between rows for smoother behavior if desired.
  - The non-monotonic Sinistar chase curve is intentional gameplay character; preserve it.
