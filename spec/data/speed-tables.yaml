      - { distance: 1536, speed:  400, accel: asrd1 }
      - { distance: 1280, speed:  384, accel: asrd1 }
      - { distance: 1024, speed:  352, accel: asrd1 }
      - { distance:  768, speed:  288, accel: asrd1 }
      - { distance:  512, speed:  192, accel: asrd1 }
      - { distance:  256, speed:  112, accel: asrd3 }
      - { distance:    0, speed:   48, accel: asrd4 }
